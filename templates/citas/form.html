{% extends "base.html" %}
{% import "_macros.html" as m %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{{ titulo }}</h1>
<div class="card shadow-sm"><div class="card-body">
  <form method="post" novalidate>
    <div class="row g-3">
      <div class="col-md-6">
        <label for="fecha_hora" class="form-label">Fecha y hora de la cita *</label>
        <input type="datetime-local" class="form-control" id="fecha_hora" name="fecha_hora" required
               value="{{ item.fecha_hora.strftime('%Y-%m-%dT%H:%M') if item.fecha_hora else '' }}">
      </div>
      <div class="col-md-6">
        <label for="estado_cita" class="form-label">Estado de la cita *</label>
        <select class="form-select" id="estado_cita" name="estado_cita" required>
          {% set estados = ['Programada', 'Atendida', 'Cancelada'] %}
          {% for est in estados %}
            <option value="{{ est }}" {{ 'selected' if (item.estado_cita == est) or (not item.estado_cita and est == 'Programada') }}>{{ est }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label for="id_paciente" class="form-label">Paciente *</label>
        <select class="form-select" id="id_paciente" name="id_paciente" required>
          <option value="">Seleccione…</option>
          {% for p in pacientes %}
            <option value="{{ p.id_paciente }}"
              {{ 'selected' if item.id_paciente|string == p.id_paciente|string }}>
              {{ p.nombre }} {{ p.apellido }} ({{ p.numero_documento }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label for="id_servicio" class="form-label">Servicio médico *</label>
        <select class="form-select" id="id_servicio" name="id_servicio" required>
          <option value="">Seleccione…</option>
          {% for s in servicios %}
            <option value="{{ s.id_servicio }}"
              {{ 'selected' if item.id_servicio|string == s.id_servicio|string }}>
              {{ s.nombre_servicio }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label for="id_medico" class="form-label">Médico *</label>
        <select class="form-select" id="id_medico" name="id_medico" required>
          <option value="">Seleccione…</option>
          {% for med in medicos %}
            <option value="{{ med.id_medico }}"
              {{ 'selected' if item.id_medico|string == med.id_medico|string }}>
              Dr. {{ med.nombre }} {{ med.apellido }} ({{ med.consultorio }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-12">
        <label for="observaciones" class="form-label">Observaciones</label>
        <textarea class="form-control" id="observaciones" name="observaciones" rows="3"
                  maxlength="500">{{ item.observaciones or '' }}</textarea>
      </div>
    </div>
    {{ m.botones_form(url_for('citas.listar')) }}
  </form>
</div></div>
{% endblock %}

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Error de conexión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
</head>
<body>
<main class="container py-5" style="max-width: 760px">
  <div class="card error-card">
   <div class="card-body p-4">
    <div class="alert alert-danger mb-3" role="alert">
    <h1 class="h4"><i class="bi bi-exclamation-triangle-fill"></i> No se pudo conectar a PostgreSQL</h1>
    <p class="mb-2">Revisa que el servidor de la base de datos <code>consultorio_medico_db</code> esté encendido y que los datos del archivo
      <code>.env</code> (DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD) sean correctos.</p>
    <pre class="small mb-0 text-wrap bg-white p-3 border rounded">{{ error }}</pre>
    </div>
    <a href="{{ url_for('inicio') }}" class="btn btn-outline-primary"><i class="bi bi-arrow-clockwise me-1" aria-hidden="true"></i> Intentar de nuevo</a>
   </div>
  </div>
</main>
</body>
</html>

{% extends "base.html" %}
{% import "_macros.html" as m %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="form-page-heading"><h1>{{ titulo }}</h1></div>
<div class="card form-card"><div class="card-body">
  <form method="post" novalidate>
    <fieldset class="form-section">
      <legend>Identificación</legend>
      <div class="row g-3">
      <div class="col-md-4">
        <label for="tipo_documento" class="form-label">Tipo de documento *</label>
        <select class="form-select" id="tipo_documento" name="tipo_documento" required>
          <option value="">Seleccione…</option>
          {% for td in tipos_documento %}
            <option value="{{ td }}" {{ 'selected' if item.tipo_documento == td }}>{{ td }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-8">
        <label for="numero_documento" class="form-label">Número de documento *</label>
        <input type="text" class="form-control" id="numero_documento" name="numero_documento"
               maxlength="20" required value="{{ item.numero_documento or '' }}">
      </div>
      </div>
    </fieldset>
    <fieldset class="form-section">
      <legend>Datos personales</legend>
      <div class="row g-3">
      <div class="col-md-6">
        <label for="nombre" class="form-label">Nombre *</label>
        <input type="text" class="form-control" id="nombre" name="nombre"
               maxlength="100" required value="{{ item.nombre or '' }}">
      </div>
      <div class="col-md-6">
        <label for="apellido" class="form-label">Apellido *</label>
        <input type="text" class="form-control" id="apellido" name="apellido"
               maxlength="100" required value="{{ item.apellido or '' }}">
      </div>
      <div class="col-md-4">
        <label for="fecha_nacimiento" class="form-label">Fecha de nacimiento *</label>
        <input type="date" class="form-control" id="fecha_nacimiento" name="fecha_nacimiento" required
               value="{{ item.fecha_nacimiento or '' }}">
      </div>
      <!-- Campo Sexo -->
      <div class="col-md-4">
        <label for="sexo" class="form-label">Sexo *</label>
        <select class="form-select" id="sexo" name="sexo" required>
          <option value="">Seleccione...</option>
          <option value="Masculino" {{ 'selected' if item.sexo == 'Masculino' }}>Masculino</option>
          <option value="Femenino" {{ 'selected' if item.sexo == 'Femenino' }}>Femenino</option>
        </select>
      </div>

      <!-- Campo RH -->
      <div class="col-md-4">
        <label for="rh" class="form-label">RH *</label>
        <select class="form-select" id="rh" name="rh" required>
          <option value="">Seleccione...</option>
          {% for tipo_rh in ['O+', 'O-', 'A+', 'A-', 'B+', 'B-', 'AB+', 'AB-'] %}
            <option value="{{ tipo_rh }}" {{ 'selected' if item.rh == tipo_rh }}>{{ tipo_rh }}</option>
          {% endfor %}
        </select>
      </div>
      </div>
    </fieldset>
    <fieldset class="form-section">
      <legend>Contacto</legend>
      <div class="row g-3">
      <div class="col-md-4">
        <label for="telefono" class="form-label">Teléfono</label>
        <input type="text" class="form-control" id="telefono" name="telefono"
               maxlength="20" value="{{ item.telefono or '' }}">
      </div>
      <div class="col-md-4">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email"
               maxlength="150" value="{{ item.email or '' }}">
      </div>
      <div class="col-md-12">
        <label for="direccion" class="form-label">Dirección</label>
        <input type="text" class="form-control" id="direccion" name="direccion"
               maxlength="200" value="{{ item.direccion or '' }}">
      </div>
      </div>
    </fieldset>
    {{ m.botones_form(url_for('pacientes.listar')) }}
  </form>
</div></div>
{% endblock %}
